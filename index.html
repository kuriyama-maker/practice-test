<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>自動車整備 試験練習アプリ</title>

<style>
:root{
  --green:#0b7d30;
  --green-soft:#eef8ec;
  --bg:#f7faf6;
  --line:#d9e7d7;
  --text:#102014;
  --shadow:0 4px 18px rgba(0,0,0,.10)
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",Meiryo,sans-serif
}

.header{
  background:#fff;
  border-top:6px solid var(--green);
  border-bottom:1px solid var(--line);
  padding:18px 26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:25px;
  font-weight:900;
  color:var(--green)
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:8px;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center
}

.container{
  max-width:1180px;
  margin:22px auto;
  padding:0 24px
}

.footer{
  margin-top:28px;
  border-top:1px solid var(--line);
  padding:22px 6px 30px;
  display:flex;
  gap:36px;
  flex-wrap:wrap;
  color:#333;
  align-items:center;
  font-size:14px
}

.badge{
  background:var(--green);
  color:#fff;
  border-radius:4px;
  padding:9px 12px;
  font-weight:900;
  margin-right:12px
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    <div class="logo-icon">🚗</div>
    <div>自動車整備 試験練習アプリ</div>
  </div>

</header>

<main class="container">

  <h1>試験を選択</h1>
  <p>
    問題を読んで回答できます。採点・正解表示・問題シャッフルに対応しています。
  </p>

  <!-- コンテンツ -->

  <footer class="footer">

    <div>

      <span class="badge">maid</span>

      <a href="https://www.kuriyama-truck.com/"
         target="_blank"
         rel="noopener noreferrer"
         style="
           color:#0b7d30;
           font-weight:700;
           text-decoration:none;
         ">

        栗山自動車工業株式会社

      </a>

    </div>

  </footer>

</main>

</body>
</html>
