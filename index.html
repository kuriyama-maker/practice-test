.answers{display:grid;gap:18px;margin-top:12px}.answers.tf{grid-template-columns:1fr 1fr}.answers.mc3{grid-template-columns:repeat(3,1fr)}

function t(key){ return UI_TEXT[uiLang][key] || key; }
function toggleLang(){
  uiLang = uiLang === 'ja' ? 'en' : 'ja';
  applyLang();
  if(currentExam) render();
}
function applyLang(){
  const h1 = document.querySelector('#top h1');
  if(h1) h1.textContent = t('selectExam');
  const p = document.querySelector('#top p');
  if(p) p.textContent = t('topDesc');
  const title = document.getElementById('headerTitle');
  if(title && !currentExam) title.textContent = t('header');
  const qTitle = document.querySelector('.q-title');
  if(qTitle) qTitle.textContent = t('instruction');
  const actionButtons = document.querySelectorAll('.actions .btn');
  if(actionButtons[0]) actionButtons[0].childNodes[0].textContent = t('shuffle');
  if(actionButtons[1]) actionButtons[1].childNodes[0].textContent = t('showAnswer') + ' ';
  if(actionButtons[2]) actionButtons[2].textContent = t('grade');
  if(actionButtons[3]) actionButtons[3].textContent = uiLang === 'ja' ? 'English' : '日本語';
  if(actionButtons[4]) actionButtons[4].textContent = t('top');
  const statDivs = document.querySelectorAll('.stats > div');
  if(statDivs[0] && document.getElementById('progress')) statDivs[0].firstChild.textContent = t('problem') + ' ';
  if(statDivs[1] && document.getElementById('answered')) statDivs[1].firstChild.textContent = t('answered') + ' ';
  if(statDivs[2] && document.getElementById('score')) statDivs[2].firstChild.textContent = t('score') + ' ';
  const navBtns = document.querySelectorAll('.nav .btn');
  if(navBtns[0]) navBtns[0].textContent = t('prev');
  if(navBtns[1]) navBtns[1].textContent = t('list');
  if(navBtns[2]) navBtns[2].textContent = t('next');
  const badges = document.querySelectorAll('.footer .badge');
  if(badges[0]) badges[0].textContent = t('source');
  if(badges[1]) badges[1].textContent = t('maker');
  const footerDivs = document.querySelectorAll('.footer > div');
  if(footerDivs[0]) footerDivs[0].lastChild.textContent = t('sourceName');
  if(footerDivs[1]) footerDivs[1].lastChild.textContent = t('makerName');
}

let currentExam=null, order=[], current=0, userAnswers={}, showCorrect=false, graded=false;
function initTop(){const grid=document.getElementById('examGrid');grid.innerHTML='';EXAMS.forEach((exam,idx)=>{const b=document.createElement('button');b.className='exam-btn';b.innerHTML=exam.title+'<span>'+exam.subtitle+'</span>';b.onclick=()=>startExam(idx);grid.appendChild(b);});}
function startExam(idx){currentExam=EXAMS[idx];order=currentExam.questions.map(q=>q.no);current=0;userAnswers={};showCorrect=false;graded=false;document.getElementById('answerToggle').textContent='OFF';document.getElementById('headerTitle').textContent=currentExam.title+' 練習アプリ';document.getElementById('top').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();}
function backTop(){document.getElementById('app').classList.add('hidden');document.getElementById('top').classList.remove('hidden');document.getElementById('headerTitle').textContent=t('header');applyLang();}
function getQ(){return currentExam.questions.find(q=>q.no===order[current]);}
function render(){if(!currentExam)return;const q=getQ();document.getElementById('qNo').textContent=q.no;document.getElementById('qImage').src=q.image;document.getElementById('progress').textContent=(current+1)+' / '+currentExam.questions.length;const selected=userAnswers[q.no]||'';const box=document.getElementById('answers');box.className='answers '+currentExam.answerType;box.innerHTML='';currentExam.options.forEach(opt=>{const b=document.createElement('button');b.className='answer';if(selected===opt.value)b.classList.add(opt.value==='×'?'selected-x':(opt.value==='○'?'selected-o':'selected-'+opt.value));if((showCorrect||graded)&&q.answer&&q.answer===opt.value)b.classList.add('correct-reveal');const mark=opt.value==='○'?'○':(opt.value==='×'?'×':opt.value);
if(currentExam.answerType==='mc3'||currentExam.answerType==='mc4'){
  b.innerHTML='<span class="mark">'+mark+'</span>';
}else{
  let labelText = opt.label;
let subText = opt.sub || '';
if(currentExam.answerType==='tf'){
  if(opt.value==='○'){ labelText = t('trueLabel'); subText = uiLang==='ja' ? 'Tadashii' : 'True'; }
  if(opt.value==='×'){ labelText = t('falseLabel'); subText = uiLang==='ja' ? 'Ayamari' : 'False'; }
}
b.innerHTML='<span class="mark">'+mark+'</span><span>'+labelText+(subText?'<span class="small">'+subText+'</span>':'')+'</span>';
}
b.onclick=()=>selectAnswer(opt.value);box.appendChild(b);});const r=document.getElementById('result');r.textContent='';r.className='result';if((showCorrect||graded)&&!q.answer){r.textContent=(uiLang==='ja'?'この問題は正解未登録です':'Answer is not registered for this question.');}else if(showCorrect&&!graded&&q.answer){r.textContent=(uiLang==='ja'?'正解：':'Answer: ')+q.answer;}else if(graded&&selected&&q.answer){if(selected===q.answer){r.textContent=t('correct');r.className='result ok';}else{r.textContent=t('incorrect')+q.answer;r.className='result ng';}}updateStats();renderList();}
function selectAnswer(ans){userAnswers[getQ().no]=ans;graded=false;render();}
function updateStats(){const answered=Object.keys(userAnswers).length;let correct=0,registered=0;currentExam.questions.forEach(q=>{if(q.answer)registered++;if(q.answer&&userAnswers[q.no]===q.answer)correct++;});document.getElementById('answered').textContent=answered+' / '+currentExam.questions.length;document.getElementById('score').textContent=graded?(correct+' / '+registered):'-';}
function nextQuestion(){if(current<order.length-1)current++;render();window.scrollTo({top:0,behavior:'smooth'});}
function prevQuestion(){if(current>0)current--;render();window.scrollTo({top:0,behavior:'smooth'});}
function gradeAll(){graded=true;showCorrect=true;document.getElementById('answerToggle').textContent='ON';render();}
function toggleAnswer(){showCorrect=!showCorrect;document.getElementById('answerToggle').textContent=showCorrect?'ON':'OFF';render();}
function shuffleQuestions(){if(!currentExam)return;for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}current=0;graded=false;render();}
function toggleList(){document.getElementById('list').classList.toggle('hidden');}
function renderList(){const list=document.getElementById('list');list.innerHTML='';order.forEach((no,idx)=>{const b=document.createElement('button');b.textContent='No.'+no;if(userAnswers[no])b.classList.add('done');b.onclick=()=>{current=idx;render();window.scrollTo({top:0,behavior:'smooth'});};list.appendChild(b);});}
initTop();applyLang();
</script>

document.documentElement.lang = lang;

if(lang==='id'){
const nodes = document.querySelectorAll('h1,h2,h3,p,button,span,label,div');
nodes.forEach(n=>{

};

document.querySelectorAll('*').forEach(el=>{
 if(el.children.length===0){
   let t = el.dataset.jp || el.innerText;
   Object.keys(dict).forEach(k=>{
      t = t.replaceAll(k, dict[k]);
   });
   el.innerText = t;
 }
});
}else{
location.reload();
}
}
